name: Lighthouse CI Performance Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lhci:
    name: Lighthouse CI Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.33.4

      - name: Install dependencies
        run: pnpm --prefix storefront install --frozen-lockfile

      - name: Build Storefront
        run: pnpm --prefix storefront run build
        env:
          SPREE_API_URL: ${{ secrets.SPREE_API_URL || 'http://localhost:3000' }}
          SPREE_PUBLISHABLE_KEY: ${{ secrets.SPREE_PUBLISHABLE_KEY || 'test-key' }}
          NEXT_PUBLIC_DEFAULT_COUNTRY: us
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_SITE_URL: https://localhost:3001
          NEXT_PUBLIC_STORE_NAME: Footware Store
          NEXT_PUBLIC_STORE_DESCRIPTION: A modern e-commerce storefront powered by Spree Commerce and Next.js.

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=perf/lighthouse/lighthouserc.json
